* {box-sizing:border-box}
html {-webkit-text-size-adjust:100%}
body {margin:0;min-width:320px;background:var(--page);color:var(--ink);font:16px/1.45 var(--font);-webkit-tap-highlight-color:transparent}
button {font:inherit;color:inherit;cursor:pointer}
:focus-visible {outline:3px solid var(--accent);outline-offset:2px}

.sync i {width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}

.hero {position:relative;height:190px;border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
.hero svg {display:block;width:100%;height:100%}
.hero-text {position:absolute;left:16px;bottom:16px;right:16px;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-sm);max-width:300px}

    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },

  // ---------- Illustrations ----------

  const scenes = {
    lake: () => `${sky}<circle class="sun" cx="250" cy="52" r="20"/>${cloud(70,48)}${cloud(180,30,.7)}<path class="str" d="M120 60q5-5 10 0q5-5 10 0M146 74q4-4 8 0q4-4 8 0"/>${hills}<path class="wt" d="M0 160Q160 146 320 160V200H0Z"/><path class="stm" d="M40 174h40M200 182h50M120 188h30" opacity=".6"/>${tree(36,140,1.1)}${tree(60,146,.8,'tr2')}${tree(282,134,1.2)}${tree(302,142,.8,'tr2')}<g transform="translate(176 152)"><path class="card" d="M-26 0h52l-6 9h-40z"/><path class="acc" d="M0-30v28M0-30l16 22H0z"/></g>`,
    home: () => `${sky}${cloud(70,40)}${cloud(250,50,.8)}${hills}<g transform="translate(160 150)"><path class="card" d="M-40-6v-34l40-28 40 28v34z"/><path class="acc" d="M-48-38l48-34 48 34-6 6-42-30-42 30z"/><rect class="sun" x="-28" y="-30" width="14" height="14" rx="2"/><rect class="sun" x="14" y="-30" width="14" height="14" rx="2"/><rect class="tk" x="-7" y="-26" width="14" height="20" rx="2"/></g>${tree(70,152,1.1)}${tree(250,150,1.1,'tr2')}${tree(282,156,.8)}`,

    chai: () => `${sky}${cloud(60,44)}${cloud(250,36,.8)}<rect class="h1" y="146" width="320" height="54"/><path class="stm" d="M150 70q-8-12 0-24M172 64q-8-12 0-24" style="stroke:var(--il-ink);opacity:.35"/><g transform="translate(160 146)"><path class="card" d="M-34-64h68l-6 58c-1 4-4 6-8 6h-40c-4 0-7-2-8-6z"/><path class="warm" d="M-31-46h62l-2 18h-58z"/><path class="str" d="M34-52c14 0 16 22 0 24" style="stroke-width:5;stroke:var(--card)"/></g><g transform="translate(236 146)"><rect class="sun" x="-18" y="-22" width="36" height="22" rx="6"/><rect class="sun" x="-14" y="-34" width="28" height="12" rx="5" opacity=".7"/></g>${tree(52,150)}`,
    spirit: () => `${sky}<circle class="sun" cx="160" cy="124" r="40"/><g class="str" opacity=".5"><path d="M160 66v-12M118 82l-8-8M202 82l8-8M100 120H88M220 120h12"/></g>${cloud(60,46)}${cloud(262,38,.8)}${hills}<g transform="translate(160 168)"><path class="pink" d="M0-26c8 8 10 18 0 26-10-8-8-18 0-26z"/><path class="warm" d="M-4 0c-14-2-24-10-26-20 12 0 22 8 26 20zM4 0c14-2 24-10 26-20-12 0-22 8-26 20z"/></g>${tree(48,150)}${tree(276,146,1.1)}`,
    games: () => `${sky}${cloud(60,40)}${cloud(250,58,.8)}${hills}${tree(30,150)}${tree(292,146,1.1,'tr2')}<g transform="translate(110 70)"><rect class="card" width="70" height="40" rx="12"/><path class="card" d="M14 38l-4 12 14-10z"/><circle class="acc" cx="20" cy="20" r="4"/><circle class="acc" cx="35" cy="20" r="4"/><circle class="acc" cx="50" cy="20" r="4"/></g><g transform="translate(170 96)"><rect class="sun" width="56" height="34" rx="11"/><path class="sun" d="M42 32l6 11-14-8z"/><path class="str" d="M14 13h28M14 21h18"/></g><g class="warm"><circle cx="90" cy="60" r="3"/><circle cx="240" cy="80" r="3.5"/><circle cx="205" cy="54" r="2.5"/></g>`,
    mystery: () => `${sky}${cloud(250,44,.8)}${hills}${tree(40,150)}${tree(286,146,1.1,'tr2')}<g transform="translate(150 110)"><circle class="card" cx="0" cy="0" r="30"/><circle class="wt" cx="0" cy="0" r="22" opacity=".6"/><path class="tk" d="M20 20l30 30" style="stroke:var(--il-trunk);stroke-width:9;stroke-linecap:round;fill:none"/></g><text x="150" y="119" text-anchor="middle" style="font:800 26px var(--font);fill:var(--il-ink)">?</text>`,
    art: () => `${sky}${cloud(70,40)}${hills}<g transform="translate(150 110)"><path class="card" d="M0-46c34 0 58 20 58 44 0 16-14 18-24 14-8-3-16 2-14 12 2 12-6 20-20 20-34 0-58-18-58-44S-34-46 0-46z"/><circle class="warm" cx="-28" cy="-14" r="8"/><circle class="sun" cx="-4" cy="-28" r="8"/><circle class="acc" cx="24" cy="-20" r="8"/><circle class="pink" cx="-30" cy="14" r="8"/></g><path class="tk" d="M232 60l-34 60" style="stroke:var(--il-trunk);stroke-width:6;stroke-linecap:round;fill:none"/><path class="warm" d="M196 116l6 4-8 12z"/>${tree(290,150,1)}`,
    sport: () => `${sky}<circle class="sun" cx="66" cy="50" r="16"/>${cloud(240,40)}${hills}<g transform="translate(220 150)"><rect class="card" x="-14" y="-44" width="4" height="44" rx="2"/><rect class="card" x="-2" y="-44" width="4" height="44" rx="2"/><rect class="card" x="10" y="-44" width="4" height="44" rx="2"/><rect class="tk" x="-15" y="-48" width="30" height="4" rx="2"/></g><path class="tk" d="M110 150l40-70" style="stroke:var(--il-sun);stroke-width:10;stroke-linecap:round;fill:none"/><circle class="warm" cx="170" cy="96" r="8"/>${person(92,160)}${tree(30,150,.9,'tr2')}`,
    sunset: () => `<rect class="dusk" width="320" height="200"/><circle class="warm" cx="160" cy="132" r="42"/><circle class="sun" cx="160" cy="132" r="30"/>${cloud(70,50)}${cloud(250,40,.8)}<path class="wt" d="M0 140Q160 128 320 140V200H0Z"/><path class="stm" d="M110 156h100M130 168h60M146 180h28" opacity=".7"/>${tree(36,140,1.1)}${tree(290,136,1.2,'tr2')}`,
    garba: () => `${sky}<path class="str" d="M0 30Q80 70 160 40T320 34"/><g><circle class="warm" cx="30" cy="42" r="5"/><circle class="sun" cx="70" cy="56" r="5"/><circle class="acc" cx="110" cy="56" r="5"/><circle class="pink" cx="150" cy="44" r="5"/><circle class="sun" cx="196" cy="38" r="5"/><circle class="warm" cx="240" cy="36" r="5"/><circle class="acc" cx="286" cy="34" r="5"/></g>${hills}<g transform="translate(160 120)"><rect class="warm" x="-4" y="-50" width="8" height="90" rx="4" transform="rotate(-28)"/><rect class="acc" x="-4" y="-50" width="8" height="90" rx="4" transform="rotate(28)"/></g><g class="pink"><circle cx="100" cy="100" r="3"/><circle cx="224" cy="96" r="3.5"/></g><g class="sun"><circle cx="118" cy="140" r="2.5"/><circle cx="206" cy="132" r="3"/></g>${person(70,170,'pink')}${person(252,170,'warm')}`,
    fire: () => `<rect class="night" width="320" height="200"/><circle class="sun" cx="250" cy="48" r="16"/><circle class="night" cx="257" cy="43" r="14"/><g class="cl"><circle cx="60" cy="40" r="1.6"/><circle cx="120" cy="24" r="1.2"/><circle cx="180" cy="50" r="1.6"/><circle cx="90" cy="70" r="1.1"/><circle cx="210" cy="28" r="1.2"/></g>${hills}${tree(40,146,1.1)}${tree(284,140,1.2)}<g transform="translate(160 150)"><path class="tk" d="M-30 6l60-10 3 8-60 10zM30 6l-60-10-3 8 60 10z"/><path class="warm" d="M0-44C14-26 18-14 14-4 10 4-10 4-14-4-18-14-14-26 0-44Z"/><path class="sun" d="M0-26C8-16 9-9 7-3 4 1-4 1-7-3-9-9-8-16 0-26Z"/></g>`,
    clean: () => `${sky}${cloud(240,40)}<rect class="h1" y="146" width="320" height="54"/><g transform="translate(160 140)"><rect class="card" x="-48" y="-46" width="96" height="46" rx="10"/><rect class="acc" x="-48" y="-46" width="96" height="10" rx="5"/><circle class="wt" cx="-20" cy="-60" r="9"/><circle class="wt" cx="2" cy="-74" r="6"/><circle class="wt" cx="20" cy="-58" r="7"/><circle class="cl" cx="-22" cy="-63" r="2.5"/></g><g transform="translate(250 146)"><rect class="tk" x="-2" y="-70" width="4" height="62" rx="2"/><path class="sun" d="M-14-10h28l4 10h-36z"/></g>${tree(50,150)}`,
    photo: () => `${sky}${cloud(60,40)}${cloud(250,44,.8)}${hills}<g transform="translate(160 106)"><rect class="ink" x="-46" y="-28" width="92" height="60" rx="12"/><rect class="ink" x="-18" y="-38" width="36" height="14" rx="4"/><circle class="card" cx="0" cy="2" r="20"/><circle class="wt" cx="0" cy="2" r="13"/><circle class="sun" cx="32" cy="-16" r="5"/></g>${person(70,172)}${person(96,172,'warm')}${person(226,172,'pink')}${person(252,172)}`,
    car: () => `${sky}<circle class="sun" cx="262" cy="46" r="16"/>${cloud(80,40)}${hills}<rect class="ink" y="164" width="320" height="16" opacity=".25"/><path class="stm" d="M20 172h26M80 172h26M140 172h26M200 172h26M260 172h26" opacity=".7"/><g transform="translate(150 162)"><path class="acc" d="M-46 0v-16c0-6 4-9 10-10l12-14c2-2 4-3 7-3h30c3 0 5 1 7 3l12 14c6 1 10 4 10 10V0z"/><path class="cl" d="M-20-26l9-11h12v11zM6-26v-11h12l9 11z"/><circle class="ink" cx="-26" cy="0" r="8"/><circle class="ink" cx="26" cy="0" r="8"/><circle class="cl" cx="-26" cy="0" r="3"/><circle class="cl" cx="26" cy="0" r="3"/></g>${tree(40,150)}${tree(290,150,.9,'tr2')}`,
    bed: () => `<rect class="wall" width="320" height="200"/><rect class="floor" y="150" width="320" height="50"/><rect class="night" x="196" y="34" width="76" height="62" rx="6"/><circle class="sun" cx="246" cy="58" r="11"/><circle class="night" cx="251" cy="54" r="10"/><g class="cl"><circle cx="212" cy="48" r="1.4"/><circle cx="226" cy="78" r="1.2"/></g><g transform="translate(130 150)"><rect class="tk" x="-80" y="-56" width="8" height="58" rx="3"/><rect class="card" x="-76" y="-30" width="150" height="26" rx="6"/><rect class="acc" x="-30" y="-36" width="104" height="22" rx="8"/><rect class="cl" x="-70" y="-44" width="36" height="16" rx="7"/></g>`,
    hike: () => `${sky}<circle class="sun" cx="70" cy="50" r="16"/>${cloud(230,40)}<path class="h2" d="M0 150L80 70l50 50 50-70 80 100H0z"/>${hills}<path d="M120 200Q170 150 230 128" style="fill:none;stroke:var(--il-cloud);stroke-width:10;stroke-linecap:round"/>${tree(70,150,1.2)}${tree(100,156,.8,'tr2')}${tree(270,138,1.1)}${person(176,128)}`
  };
  const scene = k => `<svg class="il" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${(scenes[k] || scenes.lake)()}</svg>`;
  // First match wins, so more specific words come first.
  const ART = [
    [/arriv|check.?in/, 'home'], [/chai|tea|coffee/, 'chai'], [/breakfast|lunch|dinner|snack|food|brunch|meal/, 'meal'],
    [/kram|spiritual|satsang|prayer|meditat|bhakti/, 'spirit'], [/garba|raas|dance|dandiya/, 'garba'], [/fire|bonfire|campfire|s.?mores/, 'fire'],
    [/sunset/, 'sunset'], [/mystery/, 'mystery'], [/\bart\b|craft|paint/, 'art'], [/olympic|cricket|sport|volley|frisbee/, 'sport'],
    [/game|feud|caption|ice ?breaker|quiz|trivia/, 'games'], [/clean/, 'clean'], [/photo/, 'photo'], [/exit|depart|leave|drive/, 'car'],
    [/outdoor|hike|walk|trail/, 'hike']
  ];
  const artFor = t => (ART.find(([re]) => re.test(t.toLowerCase())) || [0, 'lake'])[1];
  const TONE_WORDS = [[/\b(blue|navy|teal)\b/i,'blue'],[/\b(yellow|gold|mustard)\b/i,'yellow'],[/\b(green|olive|mint)\b/i,'green'],[/\b(red|maroon)\b/i,'red'],[/\b(orange|saffron)\b/i,'orange'],[/\b(purple|lavender|violet)\b/i,'purple'],[/\b(pink)\b/i,'pink'],[/\b(pajamas?|pyjamas?|pjs?|comfy|cozy)\b/i,'pajama']];
  // The first color word in a dress code wins, so "Blue or Pajamas" reads as blue.
  const toneOf = text => { if (!text) return ''; let best = null; for (const [re, name] of TONE_WORDS) { const m = text.match(re); if (m && (!best || m.index < best.i)) best = { i: m.index, name }; } return best ? 'tone-' + best.name : ''; };
  const shirt = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z"/></svg>';
  document.getElementById('hero').insertAdjacentHTML('afterbegin', scene('lake'));
  document.querySelectorAll('[data-art]').forEach(el => { el.innerHTML = scene(el.dataset.art); });

  // ---------- CSV ----------
  const parseCSV = text => {
    const rows = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i+1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i+1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.map(r => r.map(v => v.trim()));
  };
  // Reads rows by header name so organizers can reorder or add columns.
  const table = text => {
    const rows = parseCSV(text).filter(r => r.some(Boolean));
    const head = (rows.shift() || []).map(h => h.toLowerCase());
    const col = name => head.findIndex(h => h.startsWith(name));
    return { rows, col };
  };

  // ---------- Time ----------
  const DAY_RE = /^(monday|tuesday|wednesday|thursday|friday|saturday|sunday),?\s+([a-z]{3})[a-z]*\.?\s+(\d{1,2})$/i;
  const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const toMin = (h, m, ap) => { h = +h % 12; if (ap && ap.toLowerCase() === 'pm') h += 12; return h * 60 + (+m || 0); };
  const parseTime = raw => {
    const m = raw.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?(?:\s*[-–to]+\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?)?$/i);
    if (!m) return null;
    const endAp = m[6] || m[3], startAp = m[3] || m[6];
    if (!startAp) return null;
    const start = toMin(m[1], m[2], startAp);
    let end = m[4] ? toMin(m[4], m[5], endAp) : null;
    if (end !== null && end <= start) end += 12 * 60;
    return { start, end };
  };
  const fmt = min => { const h = Math.floor(min / 60) % 24, mm = min % 60, ap = h >= 12 ? 'pm' : 'am'; return `${h % 12 || 12}${mm ? ':' + String(mm).padStart(2, '0') : ':00'} ${ap}`; };
  const fmtRange = (s, e) => {
    if (e === null) return fmt(s);
    const a = fmt(s), b = fmt(e);
    return a.slice(-2) === b.slice(-2) ? `${a.slice(0, -3)} - ${b}` : `${a} - ${b}`;
  };
  const nowParts = () => {
    const forced = params.get('now');
    if (forced) { const [d, t = '00:00'] = forced.split('T'); const [y, mo, da] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number); return { key: `${y}-${mo}-${da}`, min: h * 60 + mi }; }
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
    return { key: `${+p.year}-${+p.month}-${+p.day}`, min: +p.hour * 60 + +p.minute };
  };

  // ---------- Build the model ----------
  const build = (schedText, dressText) => {
    const s = table(schedText), tc = Math.max(s.col('time'), 0), ec = s.col('event'), lc = s.col('location');
    const days = []; let day = null;
    for (const r of s.rows) {
      const time = r[tc] || '', event = ec >= 0 ? (r[ec] || '') : '', loc = lc >= 0 ? (r[lc] || '') : '', where = /^(tbd|tba|-+)$/i.test(loc) ? '' : loc;
      const dm = !event && time.match(DAY_RE);
      if (dm) { day = { name: dm[1][0].toUpperCase() + dm[1].slice(1).toLowerCase(), month: MONTHS.indexOf(dm[2].toLowerCase()) + 1, date: +dm[3], label: `${dm[2][0].toUpperCase()}${dm[2].slice(1, 3).toLowerCase()} ${+dm[3]}`, items: [] }; days.push(day); continue; }
      if (!day) continue;
      const title = event || (parseTime(time) ? '' : time);
      if (!title) continue;
      const t = event ? parseTime(time) : null;
      const optional = /^\(?optional\)?\s*[-:]?\s*/i.test(title);
      const clean = title.replace(/^\(?optional\)?\s*[-:]?\s*/i, '');
      day.items.push({ raw: event ? time : '', t, title: clean, optional, where, art: artFor(clean) });
    }
    const d = dressText ? table(dressText) : null;
    const dress = d ? d.rows.map(r => ({ day: (r[d.col('day')] || '').toLowerCase(), event: (r[d.col('event')] || '').toLowerCase(), wear: r[d.col('dress')] || '' })).filter(x => x.day && x.wear) : [];
    const out = days.filter(x => x.items.length);
    for (const dy of out) {
      const forDay = dress.filter(x => dy.name.toLowerCase().startsWith(x.day.slice(0, 3)));
      dy.wear = (forDay.find(x => !x.event || x.event === 'all day') || {}).wear || '';
      dy.key = `${YEAR}-${dy.month}-${dy.date}`;
      dy.items.forEach((it, i) => {
        const special = forDay.find(x => x.event && x.event !== 'all day' && it.title.toLowerCase().includes(x.event));
        it.wear = special ? special.wear : '';
        if (it.t && it.t.end === null) {
          const next = dy.items.slice(i + 1).find(n => n.t && n.t.start > it.t.start);
          it.t.until = next ? next.t.start : it.t.start + 60;
        }
      });
    }
    return out;
  };

  // ---------- Render ----------
  const main = document.getElementById('schedule');
  const state = (it, dy, now) => {
    const c = compareKeys(dy.key, now.key);
    if (c) return c < 0 ? 'past' : '';
    if (!it.t) return '';
    const end = it.t.end ?? it.t.until;
    return now.min >= end ? 'past' : now.min >= it.t.start ? 'now' : '';
  };
  const compareKeys = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return (y1 - y2) || (m1 - m2) || (d1 - d2); };
  const itemHTML = (it, st, inGroup) => {
    const time = it.t ? fmtRange(it.t.start, it.t.end) : 'Anytime';
    const tags = [st === 'now' && !inGroup ? '<span class="tag live">Now</span>' : '', it.optional && !inGroup ? '<span class="tag opt">Optional</span>' : '', it.wear ? `<span class="tag wear-tag ${toneOf(it.wear)}">Wear: ${esc(it.wear)}</span>` : ''].filter(Boolean).join('');
    return `<div class="item ${inGroup ? '' : st} ${toneOf(it.wear)}"><div class="thumb">${scene(it.art)}</div><div>${inGroup ? '' : `<span class="time">${esc(time)}</span>`}<span class="what">${esc(it.title)}</span>${it.where ? `<span class="where">${esc(it.where)}</span>` : ''}${tags ? `<div class="tags">${tags}</div>` : ''}</div></div>`;
  };
  const render = days => {
    const now = nowParts();
    if (!days.length) { main.innerHTML = `<div class="note"><b>No schedule yet</b>Check back soon.</div>`; return; }
    main.innerHTML = days.map(dy => {
      let html = '', i = 0;
      while (i < dy.items.length) {
        const it = dy.items[i];
        // Optional activities that share a time slot read as one "pick one" card.
        const same = [];
        for (let j = i; j < dy.items.length && dy.items[j].optional && it.optional && dy.items[j].raw && dy.items[j].raw === it.raw; j++) same.push(dy.items[j]);
        if (same.length > 1) {
          const st = state(same[0], dy, now);
          html += `<div class="group ${st}"><div class="group-head"><div><span class="time">${esc(fmtRange(it.t.start, it.t.end))}</span><b>Pick one</b></div><div class="tags">${st === 'now' ? '<span class="tag live">Now</span>' : ''}<span class="tag opt">Optional</span></div></div>${same.map(x => itemHTML(x, st, true)).join('')}</div>`;
          i += same.length;
        } else { html += itemHTML(it, state(it, dy, now), false); i++; }
      }
      return `<section class="day tone ${toneOf(dy.wear) || 'tone-neutral'}" id="day-${dy.name.toLowerCase()}" aria-labelledby="h-${dy.name.toLowerCase()}"><div class="dayhead"><h2 id="h-${dy.name.toLowerCase()}">${esc(dy.name)}<span>${esc(dy.label)}</span></h2>${dy.wear ? `<span class="wear">${shirt}${esc(dy.wear)}</span>` : ''}</div>${html}</section>`;
    }).join('');
  };

  // ---------- Sync status ----------
  const sync = document.getElementById('sync');
  let fetchedAt = 0, stale = false;
  const ago = t => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} hr ago` : `${Math.round(m / 1440)} d ago`; };
  const showSync = () => { if (!fetchedAt) return; sync.className = 'sync' + (stale ? ' stale' : ''); sync.innerHTML = `<i></i>${stale ? 'Offline · saved ' : 'Live · updated '}${ago(fetchedAt)}`; };

  // ---------- Load ----------
  let scrolledToToday = false, current = 'schedule';
  const scrollToToday = days => {
    if (scrolledToToday || current !== 'schedule') return; scrolledToToday = true;
    const now = nowParts(), today = days.find(d => d.key === now.key);
    const el = today && document.querySelector('.item.now, .group.now') || (today && document.getElementById('day-' + today.name.toLowerCase()));
    if (el) el.scrollIntoView({ block: 'center' });
  };
  let model = [];
  const load = async () => {
    if (!urls.schedule) { main.innerHTML = `<div class="note"><b>Schedule coming soon</b>Check back closer to the weekend.</div>`; return; }
    try {
      const get = u => fetch(u + (u.includes('?') ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
      const [sched, dress] = await Promise.all([get(urls.schedule), urls.dress ? get(urls.dress).catch(() => '') : '']);
      if (/^\s*</.test(sched)) throw new Error('not csv');
      model = build(sched, dress); fetchedAt = Date.now(); stale = false;
      store.set(CACHE_KEY, { sched, dress, at: fetchedAt });
    } catch {
      const c = store.get(CACHE_KEY);
      if (c && !model.length) { model = build(c.sched, c.dress); fetchedAt = c.at; }
      stale = true;
      if (!model.length) { main.innerHTML = `<div class="note"><b>Couldn't load the schedule</b>Check your connection and try again.<br><button type="button" id="retry">Try again</button></div>`; document.getElementById('retry').onclick = load; showSync(); return; }
    }
    render(model); showSync(); scrollToToday(model);
  };
  const cached = store.get(CACHE_KEY);
  if (cached && urls.schedule) { model = build(cached.sched, cached.dress); fetchedAt = cached.at; render(model); showSync(); }
  load();
  setInterval(() => { if (document.visibilityState === 'visible') load(); }, REFRESH_MS);
  setInterval(() => { if (model.length) render(model); showSync(); }, 30 * 1000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });

  // ---------- Pinned header ----------
  const topBar = document.querySelector('.top');
  const setTopH = () => document.documentElement.style.setProperty('--top-h', topBar.offsetHeight + 'px');
  setTopH(); addEventListener('resize', setTopH);
  addEventListener('scroll', () => topBar.classList.toggle('stuck', scrollY > 4), { passive: true });

  // ---------- Tabs ----------
  const scrollMemo = {};
  const showTab = () => {
    const next = ['schedule', 'carpool', 'rooms'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'schedule';
    scrollMemo[current] = scrollY;
    current = next;
    document.querySelectorAll('[data-view]').forEach(v => { v.hidden = v.dataset.view !== next; });
    document.querySelectorAll('[data-tab]').forEach(a => { if (a.dataset.tab === next) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    scrollTo(0, scrollMemo[next] || 0);
  };
  addEventListener('hashchange', showTab);
  showTab();

  // ---------- Add to home screen hint ----------
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const android = /android/i.test(navigator.userAgent);
  if (!standalone && (ios || android || params.has('install')) && !store.get('cw26-install-dismissed')) {
    document.getElementById('install-steps').innerHTML = android
      ? 'Tap <strong>⋮</strong> in Chrome, then <strong>Add to Home screen</strong>. It opens like an app.'
      : 'In Safari, tap <strong>Share</strong> <span aria-hidden="true">⬆︎</span>, then <strong>Add to Home Screen</strong>. It opens like an app.';
    const box = document.getElementById('install'); box.hidden = false;
    document.getElementById('install-close').onclick = () => { box.hidden = true; store.set('cw26-install-dismissed', true); };
  }
})();
</script>
</body>
</html>
